# MySQL Production / Cloud / Local Configuration
spring.datasource.url=${DB_URL:${DATABASE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/interviewprep_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${DATABASE_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${DATABASE_PASSWORD:Aiswariya00}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool Configurations for Cloud & Local Stability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
