spring.application.name=interviewprep-api
server.port=8082

# Import local git-ignored .env.properties if present
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties

# Profile configuration:
# - 'mysql': Connects to Local MySQL or Cloud MySQL
# - 'h2': Zero-config in-memory database fallback
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT Secret & Expiration (24 hours)
app.jwt.secret=${JWT_SECRET:9a67c46914561062b50937a0928929949d2e1c95b6c3214fc876f2d2ef4840f47e24a49c6b653459c2537f814b726487}
app.jwt.expiration-milliseconds=86400000

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
